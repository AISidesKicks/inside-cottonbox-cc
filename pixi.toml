[workspace]
authors = ["AISidesKicks <198066858+AISidesKicks@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "ctnb"
platforms = ["linux-64"]
version = "0.1.0"

[activation]

[activation.env]
TMPDIR = "/run/user/$UID/pixi_tmp/$PIXI_PROJECT_NAME"
SCRATCH = "$PIXI_PROJECT_ROOT/scratch"
CARGO_TARGET_DIR = "$PIXI_PROJECT_ROOT/scratch/cargo-target"

[tasks]
nanvix-fetch = "scripts/nanvix-fetch.sh"
nanvix = { cmd = "scripts/nanvix-run.sh", depends-on = ["nanvix-fetch"] }
nanvix-shell = { cmd = "scripts/nanvix-run.sh --shell", depends-on = ["nanvix-fetch"] }

[dependencies]
python = "3.12.*"
rust = ">=1.99.0,<1.100"
slirp4netns = ">=1.3.6,<2"

[pypi-dependencies]
microsandbox = ">=0.7.2, <0.8"
